[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poemtex"
version = "0.2.0"
description = "A tiny, safe language for typesetting poems and poetry collections"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PoemTeX contributors"}]
keywords = ["poetry", "latex", "typesetting", "pdf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.scripts]
poem = "poemtex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
